name: API Integration Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Build Solution
        run: dotnet build ShoppingMicroServicesApp.sln --configuration Release

      - name: Start Web APIs
        run: |
          ASPNETCORE_URLS="http://localhost:5064" dotnet run --project UsersWebAPI/UsersWebAPI.csproj &
          ASPNETCORE_URLS="http://localhost:5074" dotnet run --project PaymentWebAPI/PaymentWebAPI.csproj &
          ASPNETCORE_URLS="http://localhost:5121" dotnet run --project OrdersWebAPI/OrdersWebAPI.csproj &
          echo "Waiting for APIs to start..."
          sleep 20

      - name: Run Newman Tests
        run: |
          newman run postman/ECommerceIntegrationTests.postman_collection.json \
          --environment postman/ECommerceEnvironment_updated.postman_environment.json \
          --reporters cli,junit \
          --reporter-junit-export newman-report.xml
